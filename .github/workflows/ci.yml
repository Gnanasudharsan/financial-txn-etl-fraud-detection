name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint & type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    name: Tests (10k-row pipeline, Spark local)
    runs-on: ubuntu-latest
    env:
      FINTXN_ENV: ci
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.7"
          python-version: "3.11"
          enable-cache: true
      - name: Cache Ivy (Delta jars)
        uses: actions/cache@v4
        with:
          path: ~/.ivy2
          key: ivy-delta-3.3.3-spark-3.5.9
      - run: uv sync --all-extras --frozen
      - name: Pytest with coverage
        run: uv run pytest --cov=fintxn --cov-report=term --cov-report=xml
      - name: Coverage gate on transform modules (>= 70%)
        run: >
          uv run coverage report --fail-under=70
          --include="src/fintxn/bronze/*,src/fintxn/silver/*,src/fintxn/gold/*,src/fintxn/recon/*,src/fintxn/security/*,src/fintxn/generate/*"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml

  terraform:
    name: Terraform fmt & validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.1"
      - run: terraform -chdir=infra/terraform fmt -check -recursive
      - run: terraform -chdir=infra/terraform init -backend=false -input=false
      - run: terraform -chdir=infra/terraform validate
