# Local lakehouse infrastructure.
#   docker compose up -d                      -> S3-compatible object store + bucket init
#   docker compose --profile airflow up -d    -> also Airflow (mirrors the Databricks Job)
name: fintxn

services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    container_name: fintxn-s3
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -master.volumeSizeLimitMB=1024 -volume.max=0
      -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"   # S3 API
      - "9333:9333"   # master UI
    volumes:
      - s3data:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  bucket-init:
    image: amazon/aws-cli:2.27.0
    container_name: fintxn-bucket-init
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${S3_ADMIN_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_ADMIN_SECRET_KEY}
      AWS_DEFAULT_REGION: ${S3_REGION:-us-east-1}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        for i in $$(seq 1 30); do aws --endpoint-url http://seaweedfs:8333 s3 ls >/dev/null 2>&1 && break; sleep 2; done
        for b in fintxn-raw fintxn-bronze fintxn-silver fintxn-gold fintxn-audit; do
          aws --endpoint-url http://seaweedfs:8333 s3api head-bucket --bucket $$b 2>/dev/null \
            || aws --endpoint-url http://seaweedfs:8333 s3 mb s3://$$b
        done
        aws --endpoint-url http://seaweedfs:8333 s3 ls

  airflow-db:
    image: postgres:16-alpine
    profiles: ["airflow"]
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflowdb:/var/lib/postgresql/data

  airflow:
    build:
      context: .
      dockerfile: infra/airflow/Dockerfile
    profiles: ["airflow"]
    depends_on: [airflow-db, seaweedfs]
    env_file: .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      FINTXN_ENV: local
      S3_ENDPOINT: http://seaweedfs:8333
    command: standalone
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro

volumes:
  s3data:
  airflowdb:
